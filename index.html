<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Planificador de entrenamientos de futbol sala para Tudela F.S. Debutantes.">
<title>Entrenamiento Tudela F.S Debutantes</title>
<style>
  :root{
    --bg:#F3F7EF;
    --surface:#FFFFFF;
    --surface-alt:#E7F0E1;
    --ink:#132618;
    --ink-soft:#4C5E4F;
    --ink-faint:#7E8F7E;
    --line:#D6E2CC;
    --pitch:#1E6B3A;
    --pitch-deep:#123F22;
    --pitch-tint:#DCEEDF;
    --gold:#EFA22B;
    --gold-deep:#B9740C;
    --gold-tint:#FBEBD1;
    --red:#D5514A;
    --red-deep:#A5372F;
    --red-tint:#FBE1DF;
    --blue:#2E6FB0;
    --blue-tint:#DEEBF8;
    --shadow: 0 1px 2px rgba(19,38,24,.07), 0 8px 24px -10px rgba(19,38,24,.22);
    --radius-s:10px;
    --radius-m:16px;
    --radius-l:24px;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1712;
      --surface:#162019;
      --surface-alt:#1C2A20;
      --ink:#EAF3E7;
      --ink-soft:#AEC2AC;
      --ink-faint:#7E9482;
      --line:#2A3D2E;
      --pitch:#4CAF6E;
      --pitch-deep:#79D89A;
      --pitch-tint:#1C3524;
      --gold:#F3B94C;
      --gold-deep:#F8CE7D;
      --gold-tint:#3A2B14;
      --red:#E67872;
      --red-deep:#F0A19C;
      --red-tint:#3A1E1C;
      --blue:#6FA8DC;
      --blue-tint:#1B2C3A;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1712;
    --surface:#162019;
    --surface-alt:#1C2A20;
    --ink:#EAF3E7;
    --ink-soft:#AEC2AC;
    --ink-faint:#7E9482;
    --line:#2A3D2E;
    --pitch:#4CAF6E;
    --pitch-deep:#79D89A;
    --pitch-tint:#1C3524;
    --gold:#F3B94C;
    --gold-deep:#F8CE7D;
    --gold-tint:#3A2B14;
    --red:#E67872;
    --red-deep:#F0A19C;
    --red-tint:#3A1E1C;
    --blue:#6FA8DC;
    --blue-tint:#1B2C3A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Karla', system-ui, -apple-system, sans-serif;
    padding-inline:20px;
    padding-block:24px 60px;
    max-width:820px;
    margin:0 auto;
  }
  h1,h2,h3{font-family:'Fredoka', system-ui, sans-serif; font-weight:600; margin:0; text-wrap:balance;}
  p{margin:0;}
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace;}

  /* ---------- header ---------- */
  .topbar{display:flex; align-items:center; gap:14px; margin-bottom:22px;}
  .brand-mark{flex:none; width:46px; height:46px; color:var(--pitch);}
  .brand-mark svg{width:100%; height:100%;}
  .brand h1{font-size:1.55rem; color:var(--pitch-deep);}
  .brand .eyebrow{font-size:.82rem; color:var(--ink-soft); letter-spacing:.02em; margin-top:2px;}

  /* ---------- controls ---------- */
  .controls{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-l);
    padding:18px 20px;
    display:flex;
    flex-wrap:wrap;
    gap:18px 24px;
    align-items:flex-end;
    box-shadow:var(--shadow);
    margin-bottom:24px;
  }
  .field{display:flex; flex-direction:column; gap:6px; min-width:0;}
  .field label, .materials-field legend{
    font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft);
    padding:0;
  }
  #date-input{
    font-family:'Karla', sans-serif;
    font-size:.95rem;
    padding:9px 10px;
    border-radius:var(--radius-s);
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--ink);
  }
  .day-label{font-size:.82rem; color:var(--pitch); font-weight:700; text-transform:capitalize;}
  .materials-field{border:none; margin:0; padding:0; flex:1 1 260px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    font-size:.85rem; font-weight:600; color:var(--ink-soft);
    background:var(--surface-alt); border:1px solid var(--line);
    padding:6px 12px 6px 8px; border-radius:999px; cursor:pointer;
    user-select:none;
  }
  .chip:has(input:checked){color:var(--pitch-deep); background:var(--pitch-tint); border-color:var(--pitch);}
  .chip input{accent-color:var(--pitch); width:15px; height:15px;}

  .actions{display:flex; flex-wrap:wrap; gap:10px; margin-left:auto;}
  .btn{
    font-family:'Karla', sans-serif; font-weight:700; font-size:.88rem;
    border-radius:999px; padding:10px 18px; border:1px solid transparent;
    cursor:pointer; display:inline-flex; align-items:center; gap:8px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--pitch); color:#fff;}
  .btn-primary:hover{background:var(--pitch-deep);}
  .btn-gold{background:var(--gold); color:#2B1B04;}
  .btn-gold:hover{background:var(--gold-deep);}
  .btn-ghost{background:transparent; color:var(--ink-soft); border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--ink-soft); color:var(--ink);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  /* ---------- session card ---------- */
  .results{display:flex; flex-direction:column; gap:22px;}
  .empty-hint{
    background:var(--surface-alt); border:1px dashed var(--line); border-radius:var(--radius-m);
    padding:18px; color:var(--ink-soft); font-size:.92rem;
  }
  .warn{
    background:var(--red-tint); border:1px solid var(--red); color:var(--red-deep);
    border-radius:var(--radius-m); padding:14px 16px; font-size:.9rem; font-weight:600;
  }
  .coach-note{
    background:var(--blue-tint); border:1px solid var(--blue); border-radius:var(--radius-m);
    padding:12px 16px; font-size:.86rem; color:var(--ink-soft); line-height:1.45;
  }
  .coach-note strong{color:var(--blue); font-family:'Fredoka', system-ui, sans-serif;}
  .pill-blue{background:var(--blue-tint); color:var(--blue);}
  .session-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l);
    padding:22px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:18px;
  }
  .session-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .session-head h2{font-size:1.2rem; color:var(--ink);}
  .session-head time{text-transform:capitalize; color:var(--pitch-deep);}
  .pill{
    font-family:'IBM Plex Mono', monospace; font-size:.78rem; font-weight:600;
    padding:4px 11px; border-radius:999px; background:var(--surface-alt); color:var(--ink-soft);
    white-space:nowrap;
  }
  .pill-gold{background:var(--gold-tint); color:var(--gold-deep);}
  .pill-pitch{background:var(--pitch-tint); color:var(--pitch-deep);}
  .pill-red{background:var(--red-tint); color:var(--red-deep);}

  .phase{border-left:4px solid var(--line); padding-left:16px; display:flex; flex-direction:column; gap:10px;}
  .phase-warmup{border-color:var(--gold);}
  .phase-tech{border-color:var(--pitch);}
  .phase-match{border-color:var(--red);}
  .phase-head{display:flex; align-items:center; gap:9px;}
  .phase-head svg{width:20px; height:20px; flex:none;}
  .phase-warmup .phase-head svg{color:var(--gold-deep);}
  .phase-tech .phase-head svg{color:var(--pitch);}
  .phase-match .phase-head svg{color:var(--red);}
  .phase-head h3{font-size:1rem; flex:1;}
  .phase-items{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px;}
  .phase-items li{
    background:var(--surface-alt); border-radius:var(--radius-m); padding:12px 14px;
    display:flex; flex-direction:column; gap:5px;
  }
  .item-top{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .item-top strong{font-size:.96rem;}
  .item-top .mono{color:var(--ink-faint); font-size:.78rem;}
  .item-desc{font-size:.88rem; color:var(--ink-soft); line-height:1.45;}
  .item-meta{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .tag{
    font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    padding:2px 8px; border-radius:999px; background:var(--bg); color:var(--ink-faint); border:1px solid var(--line);
  }
  .tag-foco{background:var(--pitch-tint); color:var(--pitch-deep); border-color:transparent;}

  .ex-item{cursor:pointer; position:relative;}
  .ex-item:hover{background:var(--pitch-tint);}
  .ex-item:focus-visible{outline:2px solid var(--pitch); outline-offset:2px;}
  .toggle-hint{
    display:inline-flex; align-items:center; gap:5px; align-self:flex-start;
    font-size:.76rem; font-weight:700; color:var(--pitch); margin-top:2px;
  }
  .toggle-hint .chevron{width:14px; height:14px; transition:transform .18s ease;}
  .ex-item[aria-expanded="true"] .toggle-hint .chevron{transform:rotate(180deg);}
  .item-detail{
    margin-top:2px; padding-top:10px; border-top:1px dashed var(--line);
  }
  .item-detail p{font-size:.86rem; color:var(--ink-soft); line-height:1.55;}

  /* ---------- history ---------- */
  .history{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l);
    padding:20px 22px; box-shadow:var(--shadow);
  }
  .history-head{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .history-head h2{font-size:1.05rem;}
  .count-pill{background:var(--surface-alt); color:var(--ink-soft); font-size:.75rem; font-weight:700; padding:2px 10px; border-radius:999px;}
  .history-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px;}
  .history-item{
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    border:1px solid var(--line); border-radius:var(--radius-m); padding:11px 14px; flex-wrap:wrap;
  }
  .history-item .hi-date{font-weight:700; text-transform:capitalize; font-size:.88rem; min-width:150px;}
  .history-item .hi-summary{font-size:.82rem; color:var(--ink-soft); flex:1 1 260px;}
  .history-item .hi-del{
    background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:.78rem;
    text-decoration:underline; padding:2px 0;
  }
  .history-item .hi-del:hover{color:var(--red);}
  .history-empty{color:var(--ink-faint); font-size:.88rem;}

  .note{margin-top:26px; text-align:center; color:var(--ink-faint); font-size:.82rem;}

  /* ---------- toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom, 0px));
    transform:translateX(-50%) translateY(12px); background:var(--ink); color:var(--bg);
    padding:10px 18px; border-radius:999px; font-size:.85rem; font-weight:600;
    box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    max-width:88vw; text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  #toast.warn-toast{background:var(--red);}

  @media (max-width:640px){
    html{font-size:18px;}
    body{
      padding-inline:16px;
      padding-block:14px calc(92px + env(safe-area-inset-bottom, 0px));
    }

    .topbar{
      position:sticky; top:env(safe-area-inset-top, 0px); z-index:15;
      margin:calc(-14px - env(safe-area-inset-top, 0px)) -16px 16px;
      padding:calc(14px + env(safe-area-inset-top, 0px)) 16px 12px;
      background:color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }
    .brand h1{font-size:1.28rem;}
    .brand .eyebrow{font-size:.78rem;}
    .brand-mark{width:38px; height:38px;}

    .controls{padding:16px; border-radius:var(--radius-m); gap:16px;}
    .field label, .materials-field legend{font-size:.72rem;}
    #date-input{width:100%; padding:12px 12px; font-size:1rem; min-height:46px;}
    .day-label{font-size:.9rem;}
    .chip{padding:9px 14px 9px 10px; font-size:.92rem;}
    .chip input{width:18px; height:18px;}

    /* La barra de acciones se convierte en una barra fija tipo app, siempre a mano. */
    .actions{
      position:fixed; left:0; right:0; bottom:0; margin-left:0;
      display:flex; gap:8px; flex-wrap:nowrap;
      padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
      background:var(--surface); border-top:1px solid var(--line);
      box-shadow:0 -10px 24px -14px rgba(19,38,24,.35);
      z-index:20;
    }
    .actions .btn{flex:1 1 0; justify-content:center; padding:12px 10px; font-size:.9rem; min-height:48px;}

    .session-card{padding:16px; border-radius:var(--radius-m); gap:20px;}
    .session-head h2{font-size:1.1rem;}
    .phase{padding-left:14px;}
    .phase-head h3{font-size:1.04rem;}
    .phase-items{gap:14px;}
    .phase-items li{padding:14px 16px;}
    .item-top strong{font-size:1.02rem;}
    .item-desc{font-size:.92rem;}
    .toggle-hint{font-size:.82rem;}
    .tag{font-size:.72rem; padding:3px 9px;}

    .history{padding:18px;}

    #toast{bottom:calc(78px + env(safe-area-inset-bottom, 0px));}
  }

  @media print{
    body{max-width:none; padding:0; background:#fff; color:#000;}
    .topbar .eyebrow{color:#333;}
    .controls, .history, .note, #toast, .btn, .actions{display:none !important;}
    body{padding-bottom:0 !important;}
    .topbar{position:static !important; margin:0 0 16px !important; padding:0 !important; background:none !important; backdrop-filter:none !important; border-bottom:none !important;}
    .session-card{box-shadow:none; border:1px solid #999;}
    .phase-items li{background:#f4f4f4;}
    .toggle-hint{display:none !important;}
    .item-detail[hidden]{display:block !important;}
  }

  @media (prefers-reduced-motion: reduce){
    .btn, #toast{transition:none;}
  }

</style>

<body>
<div id="app-shell">
  <header class="topbar">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="12" cy="12" r="9"/>
        <circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/>
        <line x1="12" y1="9.4" x2="12" y2="6"/>
        <line x1="14.5" y1="11" x2="17.6" y2="9.2"/>
        <line x1="14.5" y1="13" x2="17.6" y2="14.8"/>
        <line x1="9.5" y1="11" x2="6.4" y2="9.2"/>
        <line x1="9.5" y1="13" x2="6.4" y2="14.8"/>
        <line x1="12" y1="14.6" x2="12" y2="18"/>
      </svg>
    </span>
    <div class="brand">
      <h1>Entrenamiento Tudela F.S Debutantes</h1>
      <p class="eyebrow">Planificador de entrenos · fútbol sala 4-6 años · lunes y miércoles</p>
    </div>
  </header>

  <div id="controls" class="controls">
    <div class="field">
      <label for="date-input">Fecha del entreno</label>
      <input type="date" id="date-input" value="">
      <p id="day-label" class="day-label">—</p>
    </div>
    <fieldset class="field categoria-field">
      <legend>Categoría</legend>
      <div class="chips">
        <label class="chip"><input type="radio" name="categoria" id="cat-prebenjamin" value="prebenjamin" checked> Prebenjamín (4-6)</label>
        <label class="chip"><input type="radio" name="categoria" id="cat-benjamin" value="benjamin"> Benjamín (7-8)</label>
        <label class="chip"><input type="radio" name="categoria" id="cat-alevin" value="alevin"> Alevín (9-10)</label>
        <label class="chip"><input type="radio" name="categoria" id="cat-infantil" value="infantil"> Infantil (11-12)</label>
        <label class="chip"><input type="radio" name="categoria" id="cat-cadete" value="cadete"> Cadete (13-14)</label>
        <label class="chip"><input type="radio" name="categoria" id="cat-juvenil" value="juvenil"> Juvenil (15-16)</label>
      </div>
    </fieldset>
    <fieldset class="field materials-field">
      <legend>Material disponible</legend>
      <div class="chips">
        <label class="chip"><input type="checkbox" id="mat-conos" checked> Conos</label>
        <label class="chip"><input type="checkbox" id="mat-balones" checked> Balones</label>
        <label class="chip"><input type="checkbox" id="mat-petos" checked> Petos</label>
        <label class="chip"><input type="checkbox" id="mat-aros" checked> Aros</label>
        <label class="chip"><input type="checkbox" id="mat-picas" checked> Picas</label>
        <label class="chip"><input type="checkbox" id="mat-porterias" checked> Porterías</label>
      </div>
    </fieldset>
    <div class="actions">
      <button id="btn-generate" class="btn btn-primary" type="button">Generar entreno</button>
      <button id="btn-save" class="btn btn-gold" type="button">Guardar en historial</button>
      <button id="btn-print" class="btn btn-ghost" type="button">Imprimir ficha</button>
    </div>
  </div>

  <main id="results" class="results"></main>

  <p class="note">21 peques repartidos en dos equipos: mismo plan de sesión, cada equipo en su mitad de la pista.</p>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script id="state-data" type="application/json">{"history":[]}</script>
<script id="app-logic">
(function(){
  "use strict";

  var BANK = {
    warmup: [
      {id:'w1', edadMin:4, nombre:'El semáforo', desc:'Corren libres por la pista: verde = correr, amarillo = andar despacio, rojo = quietos como estatuas.', mat:['conos'], detalle:'Reparte a los peques por toda la pista y ponte en un lateral donde te vean bien. Cuando digas "verde" corren a tope, con "ámbar" caminan despacio levantando las rodillas, y con "rojo" se quedan quietos como estatuas sin mover ni un pie. Cambia las órdenes cada 5-8 segundos y mezcla el orden para que estén atentos. Consejo: al principio hazlo tú con la voz; más adelante puedes usar un silbato distinto para cada color.'},
      {id:'w2', edadMin:4, nombre:'Pillapilla de las colas', desc:'Cada niño lleva un peto metido en el pantalón a modo de cola; hay que robar colas sin perder la propia.', mat:['petos'], detalle:'Cada niño se coloca un peto metido por dentro del pantalón, dejando un trozo colgando a la vista. A la señal, todos intentan robar colas ajenas sin que les quiten la suya, y guardan en el bolsillo las que consiguen. Quien se queda sin cola sigue jugando robando: nadie se queda parado. Consejo: si alguno se frustra por perder la cola, dale una de repuesto discretamente para que no deje de participar.'},
      {id:'w3', edadMin:5, nombre:'Los bloques de hielo', desc:'Un pillador congela tocando; los demás descongelan pasando por debajo de las piernas del congelado.', mat:[], detalle:'Un niño (o el entrenador) hace de pillador y el resto corre libre por la pista. A quien toca se queda "congelado", de pie con las piernas abiertas, hasta que un compañero pase gateando por debajo para descongelarlo. Cambia de pillador cada 1-2 minutos para que todos prueben ese rol. Consejo: marca los límites de la pista con conos bien visibles para que no se salgan corriendo.'},
      {id:'w4', edadMin:5, nombre:'Ratones y gatos', desc:'Dos filas enfrentadas; al nombrar "ratones" o "gatos" ese equipo persigue al otro hasta una línea segura.', mat:['conos'], detalle:'Dos filas se colocan una frente a otra, separadas por un par de metros, con una línea de conos a cada lado marcando la meta de cada equipo. Cuando dices "ratones", ese equipo corre hacia su línea segura mientras los "gatos" intentan tocarlos antes de que lleguen; luego se invierte. Alterna el orden de las palabras para mantener la sorpresa. Consejo: empieza con distancias cortas y ve alejando las filas según ganen confianza.'},
      {id:'w5', edadMin:5, nombre:'El espejo', desc:'Por parejas, uno hace movimientos (saltar, girar, agacharse) y el otro los copia como un espejo.', mat:[], detalle:'Se colocan por parejas, uno frente al otro a un paso de distancia. Uno hace de líder y el otro debe copiar sus movimientos como si fuera un espejo: saltar, agacharse, girar, levantar los brazos. Cada 30-40 segundos cambian de rol. Consejo: dales ideas de movimientos si se quedan sin imaginación, y anímales a hacerlo despacio para que el compañero pueda seguirles bien.'},
      {id:'w6', edadMin:4, nombre:'Islas seguras', desc:'Aros repartidos por el suelo; cuando el entrenador silba, todos deben subirse a una isla sin caer al mar.', mat:['aros'], detalle:'Reparte aros por toda la pista, uno menos que el número de niños que juegan esa ronda. Mientras corren libremente al ritmo que marques, al oír tu silbato todos deben subirse a una isla (aro) sin caerse "al mar"; quien se queda sin isla hace una prueba divertida (dar tres saltos) y sigue jugando. Ve retirando algún aro para aumentar la dificultad. Consejo: dejar aros de sobra para los más pequeños evita frustraciones innecesarias a estas edades.'},
      {id:'w7', edadMin:5, nombre:'La serpiente que crece', desc:'Un niño persigue al resto; cada uno que toca se coge de la mano y la serpiente sigue creciendo.', mat:[], detalle:'Un niño empieza siendo el pillador y persigue al resto por la pista. Cada compañero al que toca se coge de su mano, formando una serpiente cada vez más larga que sigue persiguiendo entre todos. El juego acaba cuando solo queda un niño libre, que gana esa ronda. Consejo: recuérdales que solo pueden tocar con las manos de los extremos de la serpiente para que no se hagan daño empujando.'},
      {id:'w8', edadMin:5, nombre:'El balón caliente', desc:'En círculo, se pasan un balón rápido de mano en mano; al decir "¡fuego!", quien lo tiene hace 3 saltos.', mat:['balones'], detalle:'Todos en círculo, sentados o de pie, se van pasando un balón de mano en mano lo más rápido posible. Cuando el entrenador grita "¡fuego!", el niño que tiene el balón en ese momento hace tres saltos o gira sobre sí mismo antes de seguir el juego. Varía el ritmo y el tiempo entre gritos para mantener la sorpresa. Consejo: con grupos grandes, usa dos balones a la vez para que nadie espere demasiado su turno.'},
      {id:'w9', edadMin:4, nombre:'La granja de animales', desc:'Circuito por estaciones: saltar como rana, andar como cangrejo y correr como guepardo entre los conos.', mat:['conos'], detalle:'Monta un circuito corto con conos marcando 3-4 estaciones. En cada una, los niños cambian de forma de desplazarse: saltar como rana, andar a cuatro patas como cangrejo, correr como guepardo. Pasan en fila o por grupos pequeños y repiten el circuito 2-3 veces. Consejo: exagera tú mismo los movimientos como ejemplo, les encanta imitar al entrenador haciendo el animal.'},
      {id:'w10', edadMin:4, nombre:'El túnel viajero', desc:'En fila con las piernas abiertas formando un túnel, el último gatea por dentro hasta ponerse el primero.', mat:[], detalle:'Todo el grupo se coloca en fila con las piernas bien abiertas, formando un túnel humano. El último de la fila se agacha y gatea por dentro del túnel hasta colocarse el primero, y entonces el nuevo último repite la acción. Así el "tren" avanza mientras cada uno pasa su turno por el túnel. Consejo: marca un ritmo claro ("¡ahora tú!") para que no se pisen ni se hagan un lío con el turno.'},
      {id:'w11', edadMin:4, nombre:'Pilla-pilla del entrenador', desc:'El entrenador persigue a todos; quien es tocado se sienta hasta que un compañero lo libera chocando la mano.', mat:[], detalle:'El entrenador persigue a todo el grupo por la pista delimitada con conos. Quien es tocado se sienta en el sitio donde le han pillado, y solo puede volver a jugar si otro compañero pasa y le choca la mano para liberarlo. El juego sigue mientras casi todos estén sentados esperando ayuda, lo que anima a que se ayuden entre ellos. Consejo: deja que a veces te "pillen" a ti también, les da mucha alegría y refuerza la implicación.'},
      {id:'w12', edadMin:5, nombre:'El rey del círculo', desc:'Dentro de un círculo de conos, hay que tocar todos los aros repartidos sin salirse ni chocar con nadie.', mat:['conos','aros'], detalle:'Marca un círculo grande con conos y reparte varios aros dentro. Dentro del círculo, cada niño debe tocar con el pie todos los aros posibles en un tiempo determinado, sin salirse del círculo ni chocar con los compañeros. Al acabar el tiempo, cuenta en voz alta cuántos aros ha tocado cada uno como un pequeño reto personal. Consejo: no lo plantees como competición estricta a esta edad, celebra el esfuerzo de todos por igual.'}
    ],
    tech: [
      {id:'t1', edadMin:5, nombre:'Cada uno en su casa', foco:'colocacion', desc:'Se marcan posiciones con aros (portero, defensas, delanteros); al oír "¡a casa!" cada niño corre a la suya.', mat:['aros'], detalle:'Coloca aros de colores en el suelo representando cada posición (por ejemplo, un aro para el portero, dos para defensas, dos para delanteros). Explica brevemente qué aro es cada "casa" y deja que prueben a moverse libres por la pista. Cuando grites "¡a casa!", cada niño debe correr al aro de la posición que le hayas asignado esa ronda. Consejo: ve rotando las posiciones asignadas para que todos prueben portero, defensa y ataque a lo largo de las semanas.'},
      {id:'t2', edadMin:4, nombre:'El espejo del sitio', foco:'colocacion', desc:'El entrenador señala una zona de la pista y todos corren a colocarse allí lo más rápido posible.', mat:['conos'], detalle:'Divide mentalmente la pista en 2-3 zonas (por ejemplo, mitad de ataque y mitad de defensa) y explícaselo señalando con el brazo. Los niños se mueven libremente por toda la pista y, cuando tú señalas una zona en voz alta, todos corren a colocarse dentro de ella lo más rápido posible. Añade dificultad marcando zonas más pequeñas o pidiendo que se agrupen por parejas dentro de la zona. Consejo: usa siempre el mismo gesto de brazo junto con la palabra, les ayuda a asociar la señal visual.'},
      {id:'t3', edadMin:4, nombre:'Semáforo de zonas', foco:'colocacion', desc:'La pista se divide en 3 zonas con conos de colores; al nombrar un color, todos deben estar en esa zona.', mat:['conos'], detalle:'Divide la pista en 3 zonas con conos de colores distintos (por ejemplo rojo, amarillo y verde) bien visibles desde cualquier punto. Los niños se mueven libremente y, al nombrar un color, todos deben situarse dentro de la zona de ese color en pocos segundos. Puedes combinarlo con una forma de desplazamiento (andando, a la pata coja) para hacerlo más divertido. Consejo: empieza nombrando solo dos zonas y añade la tercera cuando veas que lo dominan.'},
      {id:'t4', edadMin:6, nombre:'Ocupa el hueco', foco:'colocacion', desc:'Mientras el balón se mueve entre dos entrenadores, cada niño debe colocarse siempre en un aro libre.', mat:['aros','balones'], detalle:'Reparte aros por la pista, algunos más que niños jugando, y coloca a dos entrenadores o ayudantes que se pasan un balón entre ellos caminando. Mientras el balón se mueve, cada niño debe estar siempre dentro de un aro libre, cambiando de aro en cuanto vea que otro compañero se acerca al suyo. El objetivo es que aprendan a ocupar espacios libres en vez de amontonarse. Consejo: comenta en voz alta cuando alguien ocupa bien un hueco vacío, refuerza la idea con ejemplos reales durante el juego.'},
      {id:'t5', edadMin:5, nombre:'El barco a tu puesto', foco:'colocacion', desc:'Variante de "el barco se hunde": cada orden ("portero", "defensa", "ataque") lleva a un grupo de conos distinto.', mat:['conos'], detalle:'Es una variante de "el barco se hunde": asigna un grupo de conos distinto a cada posición (portero, defensa, ataque) en zonas separadas de la pista. Mientras corren libremente, al gritar el nombre de una posición ("¡defensa!"), solo los niños asignados a esa posición corren a su grupo de conos; el resto sigue jugando libre. Ve nombrando las tres posiciones en distinto orden para mantener la atención. Consejo: usa siempre la misma palabra para cada posición durante todo el entreno, evita sinónimos que puedan confundirles.'},
      {id:'t6', edadMin:5, nombre:'Pases por parejas', foco:'pases', desc:'Por parejas y de frente, se pasan el balón con el interior del pie, separándose un paso cada vez que lo consiguen.', mat:['balones'], detalle:'Forma parejas de niveles parecidos y colócalas una frente a otra a unos 3 metros, cada una con un balón. Deben pasarse el balón con el interior del pie, intentando que llegue rodando al compañero sin que se le escape. Cada vez que completen 3-4 pases seguidos sin fallo, pueden dar un paso hacia atrás para aumentar la distancia. Consejo: recuérdales "pie de apoyo al lado del balón, golpe con el interior", es la única indicación técnica que necesitan a esta edad.'},
      {id:'t7', edadMin:4, nombre:'El círculo mágico', foco:'pases', desc:'En círculo, se pasan el balón diciendo en voz alta el nombre del compañero que lo recibe.', mat:['balones'], detalle:'Sienta o coloca de pie a todo el grupo formando un círculo amplio, con un balón. Cada niño pasa el balón a otro compañero diciendo su nombre en voz alta justo antes de pasarlo, para que esté atento y lo reciba bien. Si el grupo es grande, puedes usar dos balones a la vez desde puntos opuestos del círculo. Consejo: este juego es también un truco estupendo para que aprendan rápido los nombres de sus compañeros de equipo.'},
      {id:'t8', edadMin:6, nombre:'Pasa y sigue', foco:'pases', desc:'Tras pasar el balón, cada niño corre a ocupar el sitio del compañero al que se lo ha pasado.', mat:['balones','conos'], detalle:'Coloca a los niños repartidos por la pista, cada uno cerca de un balón o compartiendo por parejas. Tras pasar el balón a un compañero, el que pasa corre inmediatamente a ocupar el sitio donde estaba el que ha recibido, generando movimiento continuo. Marca con conos los puntos de partida al principio si les cuesta entender la dinámica. Consejo: empieza solo con pases y, cuando lo dominen, añade que el que recibe también tenga que controlar el balón antes de pasarlo de nuevo.'},
      {id:'t9', edadMin:4, nombre:'Pases a la diana', foco:'pases', desc:'Se intenta golpear un cono o colarse dentro de un aro con un pase raso desde varios metros.', mat:['balones','conos'], detalle:'Coloca conos o aros como "dianas" a varios metros de distancia y separa a los niños en pequeños grupos, cada uno con un balón, frente a una diana. Por turnos, intentan golpear el cono o colar el balón dentro del aro con un pase raso y controlado, sin chutar fuerte. Cuenta los aciertos de cada uno como un reto personal divertido. Consejo: acerca la diana a quien le cueste más acertar, así todos sienten que progresan.'},
      {id:'t10', edadMin:5, nombre:'El tren de pases', foco:'pases', desc:'En fila, se pasa el balón al primero, que se coloca al final; el tren avanza pasando y recolocándose.', mat:['balones'], detalle:'Coloca a los niños en fila, todos mirando hacia el mismo lado, con un balón para el primero de la fila. El primero pasa el balón al segundo y corre a colocarse al final de la fila; el segundo recibe, pasa al tercero y hace lo mismo, y así sucesivamente, avanzando como un tren. Cuando dominen la mecánica, puedes cronometrar cuántas vueltas completas dan en un minuto. Consejo: al principio hazlo despacio y guía tú los turnos en voz alta hasta que cojan el ritmo.'},
      {id:'t11', edadMin:4, nombre:'El slalom de conos', foco:'conduccion', desc:'Conducir el balón en zigzag entre una hilera de conos, tocándolo con ambos pies.', mat:['balones','conos'], detalle:'Coloca una hilera de 5-6 conos separados por un paso, en línea recta. Cada niño, con su balón, debe conducirlo en zigzag entre los conos usando toques cortos con ambos pies, sin que el balón se le escape lejos. Deja que repitan el recorrido varias veces, cronometrando alguna vuelta como reto personal. Consejo: separa más los conos al principio y ve juntándolos poco a poco según ganen control.'},
      {id:'t12', edadMin:4, nombre:'Persigue tu sombra', foco:'conduccion', desc:'Conducción libre por toda la pista sin perder el balón ni chocar con ningún compañero.', mat:['balones'], detalle:'Reparte un balón por niño y deja que se muevan libremente por toda la pista, conduciendo el balón pegado al pie sin perderlo de vista ni chocar con ningún compañero. Da órdenes de vez en cuando ("¡más rápido!", "¡para el balón con la planta!") para introducir variaciones sin parar el juego. Es ideal para que cada niño toque muchísimas veces el balón en poco tiempo. Consejo: si el grupo es numeroso, delimita bien el espacio con conos para evitar choques.'},
      {id:'t13', edadMin:4, nombre:'Semáforo con balón', foco:'conduccion', desc:'Conducir el balón por la pista y, a la señal, pararlo en seco con la planta del pie.', mat:['balones','conos'], detalle:'Cada niño conduce su balón libremente por la pista al ritmo que marques con la voz o un silbato. A la señal de "stop", deben parar el balón en seco pisándolo con la planta del pie y quedarse quietos hasta la siguiente orden. Alterna órdenes de ritmo (despacio, rápido) con las de parada para practicar el control. Consejo: felicita especialmente a quien para el balón sin que se le escape, es el gesto técnico clave de este juego.'},
      {id:'t14', edadMin:5, nombre:'El camino secreto', foco:'conduccion', desc:'Circuito marcado con picas y aros que hay que recorrer conduciendo el balón sin salirse del camino.', mat:['balones','picas','aros'], detalle:'Monta un circuito serpenteante usando picas y aros en el suelo, formando un "camino" que los niños deben recorrer conduciendo el balón sin salirse ni pisar las picas. Dependiendo del espacio, pueden hacerlo en fila esperando turno o con varios circuitos paralelos para que no haya esperas largas. Anímales a completar el camino sin perder el balón antes de aumentar la velocidad. Consejo: deja que ellos mismos ayuden a montar el circuito, se lo toman como parte del juego.'},
      {id:'t15', edadMin:6, nombre:'Carrera de conducción', foco:'conduccion', desc:'Relevos por equipos: conducir el balón hasta un cono, rodearlo y volver para dar el relevo al siguiente.', mat:['balones','conos'], detalle:'Divide al grupo en equipos pequeños de 3-4 niños, en fila detrás de una línea de salida, cada equipo con un balón. Por turnos, el primero de cada fila conduce el balón hasta un cono situado varios metros por delante, rodea el cono y vuelve conduciendo hasta dar el relevo (tocar la mano) al siguiente compañero. Gana el equipo que termina antes todas sus rondas, aunque lo importante es que todos corran y toquen el balón. Consejo: iguala el nivel de los equipos para que la carrera sea emocionante para todos, no solo para los más rápidos.'}
    ],
    match: [
      {id:'m1', edadMin:4, nombre:'Partido con dos porterías', desc:'El clásico: dos equipos, dos porterías, a disfrutar y meter goles.', mat:['porterias','balones'], detalle:'Divide a los peques en dos equipos equilibrados (o usa la división habitual de tu grupo) y coloca una portería en cada extremo de la pista. Deja que jueguen con las reglas básicas del fútbol sala adaptadas: sin agobiar con el fuera de juego ni las faltas estrictas, solo animando a pasar y a disfrutar. Cambia de porteros cada pocos minutos para que todos prueben esa posición. Consejo: interviene poco en las jugadas, deja que ellos decidan y disfruten, corrige solo lo esencial de seguridad.'},
      {id:'m2', edadMin:5, nombre:'Partido a 4 porterías', desc:'Se colocan 4 mini porterías con conos; vale marcar en cualquiera para que todos ataquen más.', mat:['conos','balones'], detalle:'Coloca 4 mini porterías (dos conos separados medio metro) una en cada esquina o lado de la pista, en vez de las dos porterías tradicionales. Cualquier equipo puede marcar gol en cualquiera de las 4 porterías, lo que multiplica las opciones de ataque y hace que participen más niños a la vez. Es ideal para trabajar la idea de buscar espacios libres para atacar. Consejo: numera o pinta las porterías de colores distintos para que sea más fácil dirigir el juego con instrucciones cortas.'},
      {id:'m3', edadMin:4, nombre:'Partido sin líneas', desc:'Todo vale dentro de la pista: sin fueras de banda ni faltas, solo correr y disfrutar del balón.', mat:['balones'], detalle:'Juega un partido normal pero sin pitar fuera de banda, faltas ni otras interrupciones: el balón sigue en juego pase lo que pase, salvo que se salga muy lejos de la pista. Esto mantiene el ritmo altísimo y evita las esperas que a estas edades hacen que se despisten. Solo debes intervenir si hay riesgo de un golpe fuerte entre dos niños. Consejo: es el partido perfecto para cerrar el entreno con máxima diversión y sin interrupciones que corten el juego.'},
      {id:'m4', edadMin:4, nombre:'Partido con comodín', desc:'El entrenador juega siempre con el equipo que no tiene el balón, para ayudarles a recuperarlo.', mat:['balones','petos'], detalle:'Juega un partido normal, pero tú (el entrenador) participas siempre ayudando al equipo que en ese momento no tiene el balón, sin marcar goles tú mismo. Esto ayuda a los equipos con más dificultad a recuperar balones y sentirse partícipes del juego, evitando que un equipo domine todo el partido. Ve cambiando de bando cada vez que el balón cambia de equipo. Consejo: aprovecha tu posición de comodín para dar indicaciones sencillas en caliente, como "¡busca un hueco!".'},
      {id:'m5', edadMin:4, nombre:'Gol de oro', desc:'Cada punto se juega hasta el primer gol; en cuanto entra, se reinicia una ronda nueva.', mat:['porterias','balones'], detalle:'Cada ronda se juega solo hasta que se marca el primer gol; en cuanto entra, paras el juego un segundo, celebras el gol con el grupo y reinicias una ronda nueva desde el centro. Esto genera muchos reinicios y momentos de celebración en poco tiempo, algo que en estas edades mantiene muy alta la motivación. Puedes llevar la cuenta de goles de cada ronda en voz alta como parte de la diversión. Consejo: reinicia rápido, la clave de este juego es no dejar tiempos muertos entre rondas.'},
      {id:'m6', edadMin:6, nombre:'Partido 3 toques', desc:'Cada jugador puede tocar el balón un máximo de 3 veces antes de pasarlo o chutar.', mat:['balones','petos'], detalle:'Juega un partido normal, pero cada jugador solo puede tocar el balón un máximo de 3 veces (por ejemplo: controlar, y dos toques más para pasar o chutar) antes de tener que soltarlo. Es un reto divertido más que una norma estricta a estas edades: no hace falta pitar faltas si se pasan, solo recordarlo con humor. Ayuda a que no acaparen el balón y aprendan a pasarlo antes. Consejo: cuenta en voz alta los toques de algún niño como ejemplo ("¡uno, dos, tres, pasa!") para que el resto entienda la dinámica jugando.'},
      {id:'m7', edadMin:4, nombre:'Partido con dos balones', desc:'Dos balones en juego a la vez para que todos los peques participen mucho más.', mat:['balones','petos'], detalle:'Juega el mismo partido de siempre pero metiendo un segundo balón en juego a la vez, de forma que haya dos jugadas simultáneas en la misma pista. Esto multiplica las ocasiones de que cada niño toque el balón, algo clave para mantener su interés a esta edad. Retira uno de los balones si ves que se genera demasiado caos o algún golpe. Consejo: usa balones de colores distintos para que resulte más fácil seguir las dos jugadas a la vez.'},
      {id:'m8', edadMin:5, nombre:'Rey del gol', desc:'Se juega en equipo, pero cada gol también suma un punto individual para quien lo marca.', mat:['porterias','petos'], detalle:'Juega un partido por equipos como siempre, pero además de celebrar el resultado del equipo, lleva la cuenta de qué niño marca cada gol como un pequeño reconocimiento individual. Al final del partido, felicita en voz alta a todos los que han marcado al menos un gol, sin convertirlo en una competición seria entre ellos. Consejo: destaca también buenas jugadas de pase o de defensa, no solo los goles, para no centrar todo el foco en marcar.'}
    ]
  };

  var BANK_BENJAMIN = {
    warmup: [
      {id:'bjw1', nombre:'Escalera de coordinación', desc:'Pasos rápidos entre picas en el suelo simulando una escalera, primero sin balón y después conduciéndolo.', mat:['picas'], detalle:'Coloca picas en el suelo formando una escalera de coordinación (o dibuja los cuadros con tiza). Cada jugador pasa haciendo distintos apoyos (un pie por cuadro, dos pies, cruzado) y en la segunda vuelta lo repite conduciendo el balón con los pies. Es la base de la coordinación específica que necesitarán para los gestos técnicos de esta etapa. Consejo: prioriza la ejecución correcta sobre la velocidad, ya habrá tiempo de acelerar cuando dominen el patrón.'},
      {id:'bjw2', nombre:'Rondo de activación', desc:'Un grupo pequeño en círculo mantiene el balón con toque libre mientras uno o dos compañeros intentan interceptarlo en el centro.', mat:['balones'], detalle:'Forma grupos de 5-6 con un balón, uno o dos jugadores dentro del círculo intentando tocar el balón mientras el resto se lo pasa con toque libre (uno o dos toques). Rota a quien está dentro cada 45-60 segundos. Es un calentamiento con balón que ya empieza a exigir atención y comunicación entre compañeros. Consejo: si el grupo es muy justo tocando el balón, permite tres toques para que no se frustren.'},
      {id:'bjw3', nombre:'Pillapilla con balón', desc:'Todos conducen su balón por la pista mientras intentan tocar el balón de los demás sin perder el suyo.', mat:['balones','conos'], detalle:'Cada jugador con su balón se mueve libremente por la pista; el objetivo es tocar el balón de un compañero (sacándolo un poco de su control) sin que le quiten el suyo propio. Quien pierde el control de su balón sigue jugando igualmente, solo lo recupera y continúa. Es un juego exigente de control y visión periférica a la vez. Consejo: delimita bien el espacio, con más jugadores conviene reducirlo para que haya más contacto con el juego.'},
      {id:'bjw4', nombre:'Circuito de reacción', desc:'Salidas rápidas a distintas señales (visual, sonora, nombre) desde posiciones variadas.', mat:['conos'], detalle:'Coloca a los jugadores en distintas posiciones de partida (de pie, sentados, de espaldas) y da salidas a una señal variada: un silbido, levantar un brazo, decir un color. Cada salida es una carrera corta de 5-8 metros hasta un cono. Trabaja el tiempo de reacción, clave para el fútbol sala por los espacios reducidos. Consejo: varía el tipo de señal en cada serie para que no anticipen por costumbre.'},
      {id:'bjw5', nombre:'Relevos con conducción', desc:'Por equipos, conducir el balón hasta un cono con cambios de dirección y volver para dar el relevo.', mat:['balones','conos'], detalle:'Divide en equipos de 3-4 en fila. Cada corredor conduce el balón haciendo un recorrido con 2-3 cambios de dirección marcados por conos, y al volver dando el relevo al siguiente. Cronometra alguna ronda como reto. Consejo: exige que toquen el balón con las dos piernas durante el recorrido, no solo con la dominante.'}
    ],
    tech: [
      {id:'bjt1', foco:'colocacion', nombre:'Control orientado', desc:'Recibir el balón y con el primer toque orientarlo ya hacia el lado donde se quiere jugar.', mat:['conos','balones'], detalle:'Coloca a los jugadores en parejas o pequeños grupos; uno pasa y el otro recibe con el primer toque orientado hacia un cono o dirección marcada, sin pararlo pegado al pie. Es el gesto técnico más importante de esta etapa: jugar de cara, no de espaldas. Corrige la posición del cuerpo antes de que llegue el balón, deben mirar antes de recibir. Consejo: marca con un cono el lado hacia el que deben orientar cada vez, así ves de un vistazo quién lo hace bien.'},
      {id:'bjt2', foco:'pases', nombre:'Pase a un toque en cuadrado', desc:'Cuatro jugadores en las esquinas de un cuadrado se pasan el balón a un solo toque, cambiando de lado.', mat:['balones','conos'], detalle:'Marca un cuadrado de unos 6x6 metros con un jugador en cada esquina y un balón en juego. El pase se da siempre a un toque, sin parar el balón, intentando mantener el ritmo sin perder el control. Añade un segundo balón cuando lo dominen para multiplicar la exigencia. Consejo: si se les escapa mucho el balón, permite dos toques y ve exigiendo el toque único poco a poco.'},
      {id:'bjt3', foco:'conduccion', nombre:'Conducción con cambio de ritmo', desc:'Conducir el balón alternando tramos rápidos y lentos entre conos, sin perder el control.', mat:['balones','conos'], detalle:'Marca un recorrido con conos y pide que lo hagan conduciendo el balón, acelerando en los tramos rectos y frenando (parando el balón con la planta) en los conos marcados de otro color. El cambio de ritmo es una de las armas técnicas más útiles en espacios reducidos. Consejo: exagera tú el gesto de frenada con la planta como modelo, es un gesto que les cuesta automatizar.'},
      {id:'bjt4', foco:'conduccion', nombre:'1 contra 1 a portería', desc:'Duelo individual desde media pista: conducir, regatear al defensor y rematar a portería.', mat:['balones','porterias'], detalle:'Coloca un atacante y un defensor enfrentados a unos 10 metros de la portería. El atacante conduce, intenta un regate simple (cambio de ritmo o de dirección) para superar al defensor y remata. Rota después de cada acción. Es de los ejercicios más formativos de esta edad: decisión, técnica y finalización en un solo gesto. Consejo: si el defensor gana siempre, dale ventaja de posición al atacante para que no se frustre.'},
      {id:'bjt5', foco:'remate', nombre:'Remate tras pase', desc:'Recibir un pase de un compañero y rematar a portería sin pararlo del todo.', mat:['balones','porterias'], detalle:'Un jugador pasa desde un lateral y el que recibe remata a portería intentando no dar más de un toque antes de chutar. Cambia el ángulo del pase en cada ronda (desde la derecha, desde la izquierda, desde atrás) para que aprendan a rematar en distintas posiciones. Consejo: valora también los remates que salen desviados pero con buena forma técnica, no solo los que acaban en gol.'},
      {id:'bjt6', foco:'pases', nombre:'Rondo 4 contra 1', desc:'Cuatro jugadores mantienen la posesión en un espacio reducido mientras uno defiende en el centro.', mat:['balones','conos'], detalle:'Marca un espacio de unos 8x8 metros con 4 atacantes en las esquinas o el perímetro y 1 defensor en el centro que intenta interceptar o tocar el balón. Si lo consigue, cambia con quien dio el último pase. Introduce el concepto de mantener el balón bajo presión, base de todo el fútbol sala posterior. Consejo: exige que hablen entre ellos avisando de si el defensor viene o está libre el compañero.'}
    ],
    match: [
      {id:'bjm1', nombre:'Partido con gol validado tras pase', desc:'El gol solo cuenta si antes hubo al menos un pase de un compañero en la jugada.', mat:['balones','porterias'], detalle:'Juega un partido normal pero solo se valida el gol si en la jugada previa ha habido como mínimo un pase entre compañeros (evita el gol tras robo y disparo individual directo). Fomenta que busquen jugar en equipo en vez de ir solos hacia la portería. Consejo: no lo apliques de forma estricta con silbato, coméntalo con humor cuando pase para que lo entiendan jugando.'},
      {id:'bjm2', nombre:'Partido 1 contra 1 más apoyo', desc:'Duelos de 2 contra 1 rotativos dentro de un espacio reducido con portería pequeña.', mat:['balones','conos'], detalle:'Divide la pista en 2-3 espacios pequeños con una portería mini en cada uno. En cada espacio se juega 2 contra 1, rotando el defensor cada gol o cada minuto. Multiplica los duelos individuales y las decisiones de pase de apoyo frente al 1 contra 1. Consejo: cambia también a los atacantes de espacio de vez en cuando para que no siempre jueguen con el mismo compañero.'},
      {id:'bjm3', nombre:'Partido libre con corrección', desc:'Partido normal en el que el entrenador para brevemente para corregir un concepto puntual y sigue.', mat:['balones','porterias','petos'], detalle:'Juega un partido con las reglas habituales, pero permítete parar el juego 10-15 segundos cuando veas una situación clara para corregir (un control mal orientado, no mirar antes de recibir) y que lo repitan una vez antes de continuar. Es el momento de aplicar en juego real lo trabajado en la parte técnica. Consejo: no pares más de 3-4 veces en todo el partido, o perderán el ritmo y la diversión.'},
      {id:'bjm4', nombre:'Partido con porteros rotativos', desc:'Partido normal cambiando de portero cada pocos minutos para que todos prueben esa posición.', mat:['balones','porterias'], detalle:'Juega un partido normal estableciendo turnos fijos de portero (por ejemplo, 3-4 minutos cada uno) anunciados antes de empezar. A esta edad es importante que todos pasen por la portería, forma parte de entender el juego completo. Consejo: dales alguna indicación básica de colocación en la portería antes de su turno, no hace falta un entreno específico todavía.'}
    ]

  var BANK_ALEVIN = {
    warmup: [
      {id:'alw1', nombre:'Activación con desplazamientos', desc:'Movilidad articular seguida de desplazamientos laterales, skipping y carrera con cambios de dirección.', mat:[], detalle:'Dedica 3-4 minutos a movilidad de tobillos, rodillas y cadera, y sigue con desplazamientos laterales, skipping y carreras cortas con cambio de dirección a la señal. A esta edad conviene empezar a estructurar el calentamiento como lo haría un entreno adulto, aunque en formato de juego. Consejo: convierte cada ejercicio en un reto contra el compañero de al lado para que no se haga monótono.'},
      {id:'alw2', nombre:'Rondo de posesión 5 contra 2', desc:'Cinco jugadores mantienen el balón en un espacio reducido frente a dos defensores que presionan.', mat:['balones','conos'], detalle:'Marca un espacio de unos 10x10 metros con 5 atacantes en el perímetro y 2 defensores dentro que presionan de verdad para robar. Si roban, cambian con los dos últimos que perdieron el balón. Introduce presión real como calentamiento específico de la sesión. Consejo: limita a dos toques para que la circulación sea rápida y realista.'},
      {id:'alw3', nombre:'Circuito de velocidad de reacción', desc:'Series cortas de sprint con balón partiendo de distintas posiciones y a distintas señales.', mat:['balones','conos'], detalle:'Monta un circuito de 10-15 metros con salidas variadas (de espaldas, sentado, con balón parado al lado) y a la señal deben salir conduciendo el balón lo más rápido posible hasta un cono. Trabaja la velocidad de reacción aplicada directamente con balón, no solo carrera libre. Consejo: deja descanso suficiente entre series, la calidad de la salida importa más que la cantidad de repeticiones.'},
      {id:'alw4', nombre:'Posesión en espacio reducido', desc:'Juego de 4 contra 4 sin porterías, solo manteniendo el balón en un espacio marcado.', mat:['balones','conos','petos'], detalle:'Marca un rectángulo pequeño y juega 4 contra 4 (o similar) sin porterías, el objetivo es sumar el mayor número de pases seguidos posible. Es un calentamiento que ya mete ritmo de partido y toma de decisiones bajo presión. Consejo: pon un marcador de pases en voz alta, la competición por superar la racha anterior engancha mucho a esta edad.'},
      {id:'alw5', nombre:'Pillapilla por parejas con conducción', desc:'Por parejas, uno conduce el balón intentando escapar mientras el otro intenta robárselo.', mat:['balones','conos'], detalle:'Por parejas de nivel similar, uno conduce el balón por un espacio delimitado intentando protegerlo del compañero, que intenta robárselo sin hacer falta. Cambian de rol cada 30-40 segundos. Es un calentamiento competitivo que activa el ritmo de partido desde el primer minuto. Consejo: emparéjalos por nivel similar para que el duelo sea real y motivador para ambos.'}
    ],
    tech: [
      {id:'alt1', foco:'pases', nombre:'Pase y control a un toque', desc:'Circuito de pases donde cada jugador debe controlar y devolver el balón en el menor número de toques posible.', mat:['balones','conos'], detalle:'Organiza grupos de 3-4 en movimiento (no estáticos) que se van pasando el balón exigiendo un control orientado y devolución rápida, idealmente a uno o dos toques. Incorpora movimiento constante de quien no tiene el balón para buscar ángulos de pase. Consejo: para el ejercicio y pide que enseñen con el pie dónde han controlado el balón, ayuda a que sean conscientes del gesto.'},
      {id:'alt2', foco:'colocacion', nombre:'Cambio de orientación', desc:'Mover el balón de un lado de la pista a otro con dos o tres pases mientras el resto del equipo se reposiciona.', mat:['balones','conos'], detalle:'Divide la pista en dos mitades imaginarias con jugadores repartidos en ambas. El equipo con balón debe cambiarlo de lado con 2-3 pases mientras los compañeros del lado contrario se preparan para recibir. Introduce la idea de que el balón viaja más rápido que el jugador. Consejo: prohíbe temporalmente el pase directo al lado contrario para forzar que usen los pases intermedios.'},
      {id:'alt3', foco:'conduccion', nombre:'Conducción protegiendo balón', desc:'Conducir el balón bajo presión de un defensor, usando el cuerpo para proteger el balón del rival.', mat:['balones','conos'], detalle:'Por parejas, un atacante conduce el balón dentro de un espacio reducido mientras un defensor presiona sin poder hacer falta; el atacante debe interponer el cuerpo entre el balón y el rival. Es la base técnica para jugar bajo presión, constante en el fútbol sala. Consejo: recuérdales que el cuerpo protege, pero el balón siempre tiene que quedar a un toque de distancia, ni muy pegado ni muy lejos.'},
      {id:'alt4', foco:'remate', nombre:'Remate con ambas piernas', desc:'Series de remate a portería alternando pierna dominante y no dominante desde distintas posiciones.', mat:['balones','porterias'], detalle:'Organiza series de remate desde varias posiciones frente a portería, alternando obligatoriamente pierna buena y mala en tandas seguidas. A esta edad conviene insistir en la bilateralidad antes de que se asiente el hábito de usar solo una pierna. Consejo: no valores solo si entra el gol, fíjate en si el gesto con la pierna menos hábil está mejorando sesión a sesión.'},
      {id:'alt5', foco:'tactica', nombre:'Rondo 4 contra 2', desc:'Cuatro atacantes mantienen la posesión frente a dos defensores que presionan activamente para robar.', mat:['balones','conos'], detalle:'En un espacio de unos 10x10 metros, 4 atacantes mantienen el balón frente a 2 defensores que presionan de verdad. Es el primer rondo con superioridad reducida (4v2 en vez de 4v1), exige más calidad de pase y apoyos. Consejo: pide a los atacantes que abran bien el espacio, ocupando las esquinas del cuadrado, no que se amontonen cerca del balón.'},
      {id:'alt6', foco:'tactica', nombre:'Transición rápida', desc:'Tras recuperar el balón, atacar hacia portería en menos de 5 segundos antes de que el rival se reorganice.', mat:['balones','porterias','petos'], detalle:'Enfrenta a dos grupos: uno defiende y, en el momento que recupera el balón (interceptación o robo), dispone de 5 segundos para atacar y rematar antes de que suene tu silbato. Introduce el concepto de transición rápida, clave táctica del fútbol sala moderno. Consejo: cuenta tú en voz alta los segundos, ayuda a que interioricen la urgencia sin necesidad de explicártelo mucho.'}
    ],
    match: [
      {id:'alm1', nombre:'Partido con sistema 1-2-1', desc:'Partido introduciendo posiciones de referencia: un cierre, dos alas y un pívot.', mat:['balones','porterias','petos'], detalle:'Explica de forma sencilla las cuatro posiciones básicas del sistema 1-2-1 (cierre atrás, dos alas en los costados, pívot arriba) y asígnalas antes de empezar el partido. No exijas que lo mantengan de forma rígida, es solo una referencia inicial de ocupación del espacio. Consejo: para el partido un par de veces para preguntar \'¿dónde tienes que estar tú ahora?\' en vez de decírselo directamente.'},
      {id:'alm2', nombre:'Partido con pressing tras pérdida', desc:'Al perder el balón, el equipo dispone de 5 segundos para presionar e intentar recuperarlo cerca de donde lo perdió.', mat:['balones','porterias','petos'], detalle:'Juega un partido normal marcando la norma de que, nada más perder el balón, ese equipo debe presionar con intensidad durante 5 segundos antes de replegarse. Pasado ese tiempo, pueden organizarse en defensa normal. Trabaja el hábito de reacción inmediata a la pérdida, muy valorado en el fútbol sala de formación. Consejo: si un equipo no presiona, para el juego y hazles repetir la jugada desde la pérdida.'},
      {id:'alm3', nombre:'Partido de posesión aplicada', desc:'Partido normal donde cada racha de 5 pases seguidos suma un punto extra al marcador.', mat:['balones','porterias','petos'], detalle:'Juega un partido con las reglas habituales, pero suma un punto adicional al equipo cada vez que completa una racha de 5 pases seguidos sin perder el balón, además de los goles normales. Fomenta valorar la posesión con sentido, no solo el resultado final. Consejo: anuncia en voz alta la cuenta de pases, genera tensión positiva y ayuda a que cuenten ellos mismos.'},
      {id:'alm4', nombre:'Partido libre con corrección táctica', desc:'Partido normal parando puntualmente para corregir decisiones de posicionamiento o de pase.', mat:['balones','porterias','petos'], detalle:'Juega con normalidad, pero aprovecha para detener el juego brevemente cuando veas una decisión táctica mejorable (mal apoyo, no cambiar de orientación) y haz que repitan la jugada aplicando la corrección. Es el cierre natural de una sesión centrada en conceptos de equipo. Consejo: felicita en voz alta cuando apliquen bien algo trabajado en la parte técnica, refuerza el aprendizaje mejor que la corrección en sí.'}
    ]
  };

  var BANK_INFANTIL = {
    warmup: [
      {id:'inw1', nombre:'Activación física completa', desc:'Movilidad articular, activación muscular y series cortas de velocidad antes de empezar la sesión.', mat:['conos'], detalle:'Estructura el calentamiento en tres bloques: movilidad articular (2-3 min), activación con desplazamientos multidireccionales (3-4 min) y 2-3 series cortas de velocidad máxima de 10-15 metros. A esta edad el calentamiento empieza a tener entidad física propia, no solo lúdica. Consejo: incorpora balón en el último bloque para no perder tiempo de contacto con él.'},
      {id:'inw2', nombre:'Rondo de posesión con presión real', desc:'Seis atacantes mantienen el balón frente a tres defensores que presionan con intensidad de partido.', mat:['balones','conos'], detalle:'En un espacio de unos 12x12 metros, 6 jugadores mantienen el balón frente a 3 defensores que presionan a máxima intensidad, con cambios cuando se produce el robo. La proporción 6 contra 3 obliga a una calidad de pase y desmarque más exigente que en categorías anteriores. Consejo: limita el número de toques (uno o dos) para que la exigencia sea real.'},
      {id:'inw3', nombre:'Circuito de agilidad', desc:'Cambios de dirección a máxima velocidad entre conos, con y sin balón.', mat:['balones','conos'], detalle:'Monta un circuito en forma de zigzag o estrella con conos y hazlo primero sin balón a máxima intensidad, y después conduciendo el balón, comparando los tiempos. Trabaja la agilidad específica que necesitan en los espacios reducidos del fútbol sala. Consejo: deja descanso completo entre repeticiones, la calidad del cambio de dirección cae mucho con fatiga acumulada.'},
      {id:'inw4', nombre:'Posesión con porterías pequeñas', desc:'Juego de 4 contra 4 con dos porterías pequeñas en los extremos, sumando puntos por posesión y por gol.', mat:['balones','conos'], detalle:'Coloca dos porterías pequeñas (conos separados) en los extremos de un espacio reducido y juega 4 contra 4 combinando el objetivo de mantener el balón con el de buscar gol. Es un calentamiento ya muy cercano al juego real de la categoría. Consejo: anímales a decidir rápido entre mantener la posesión o buscar la finalización según el momento del juego.'},
      {id:'inw5', nombre:'Activación portero-jugadores', desc:'Bloque breve de activación específica para el portero (reflejos, salidas) en paralelo al resto del grupo.', mat:['balones'], detalle:'Mientras el grupo hace la activación general, dedica 5 minutos aparte al portero o porteros con ejercicios de reflejos (paradas cortas a distancia), salidas a los pies y colocación básica. A esta edad conviene empezar a dar contenido específico a la posición. Consejo: si tienes varios porteros, hazlo por turnos para no descuidar su participación en el resto de la sesión.'}
    ],
    tech: [
      {id:'int1', foco:'colocacion', nombre:'Recepción orientada bajo presión', desc:'Controlar el balón con un defensor cerca, orientando el primer toque hacia el espacio libre.', mat:['balones','conos'], detalle:'Por tríos: un pasador, un receptor y un defensor semiactivo que presiona sin robar con contacto. El receptor debe controlar orientando el primer toque hacia el lado contrario al defensor. Es la consolidación técnica del control orientado trabajado en categorías anteriores, ahora con oposición real. Consejo: sube la intensidad del defensor progresivamente en la misma sesión según vayan dominando el gesto.'},
      {id:'int2', foco:'pases', nombre:'Pase largo y cambio de orientación', desc:'Pases de media-larga distancia para cambiar el juego de un lado a otro de la pista con precisión.', mat:['balones','conos'], detalle:'Coloca a los jugadores en los extremos de la pista y trabaja el pase largo raso, buscando precisión en la recepción del compañero. Alterna con secuencias donde deben decidir entre pase corto o cambio de orientación según la posición del defensor imaginario. Consejo: prioriza siempre la precisión sobre la potencia, un pase largo mal dado pierde la posesión igual que un mal control.'},
      {id:'int3', foco:'remate', nombre:'Remate de volea o media distancia', desc:'Finalización a portería sin control previo, golpeando el balón que llega por alto o a media altura.', mat:['balones','porterias'], detalle:'Un compañero lanza o pasa el balón por alto o a media altura y el rematador debe golpear sin controlar, ajustando el cuerpo al vuelo del balón. Es un gesto técnico más avanzado que exige buena coordinación óculo-pédica. Consejo: empieza con balones más lentos y sube la velocidad del envío según vayan cogiendo el gesto.'},
      {id:'int4', foco:'tactica', nombre:'1 contra 1 defensivo', desc:'Trabajo específico de la posición defensiva: no entrar de cara, achicar espacios y forzar hacia fuera.', mat:['balones','conos'], detalle:'Por parejas, el defensor debe practicar la posición correcta (ligeramente de perfil, sin lanzarse de cara) para forzar al atacante hacia la banda o hacia una zona de menor peligro, sin necesidad de robar el balón, solo de contener. Es contenido específico de esta etapa: la defensa deja de ser solo intentar robar, ahora es también posicional. Consejo: premia las contenciones bien hechas igual que premiarías un robo de balón.'},
      {id:'int5', foco:'tactica', nombre:'Desmarques de ruptura y apoyo', desc:'Trabajar los dos tipos de desmarque: al espacio (ruptura) y al balón (apoyo), según la situación.', mat:['balones','conos'], detalle:'Con un jugador de balón y dos o tres compañeros sin balón, practica que unos busquen el desmarque de ruptura (al espacio, para recibir en profundidad) y otros el de apoyo (acercarse al balón para facilitar el pase), alternando roles. Introduce la lectura táctica de cuándo conviene cada tipo de desmarque. Consejo: para el ejercicio en el momento justo y pregunta \'¿qué desmarque tocaba ahí?\' para que razonen la decisión.'},
      {id:'int6', foco:'tactica', nombre:'Superioridad 5 contra 3 con finalización', desc:'Juego de posesión con superioridad numérica que termina siempre en remate a portería.', mat:['balones','porterias','conos'], detalle:'En medio campo, 5 atacantes contra 3 defensores buscan progresar y finalizar a portería aprovechando la superioridad numérica, con límite de tiempo por posesión para forzar la decisión. Conecta el trabajo de rondo con la finalización real, cerrando el ciclo técnico-táctico. Consejo: si los atacantes tardan demasiado en decidir, añade un límite de toques totales antes de disparar.'}
    ],
    match: [
      {id:'inm1', nombre:'Partido con sistema 1-2-1', desc:'Partido aplicando el sistema 1-2-1 con roles algo más definidos que en categorías anteriores.', mat:['balones','porterias','petos'], detalle:'Juega con el sistema 1-2-1 asignado desde el inicio, pidiendo que mantengan referencias de posición sin ser demasiado estrictos. A esta edad ya pueden entender por qué se ocupa cada zona, no solo memorizar dónde colocarse. Consejo: explica brevemente el porqué de cada posición antes de empezar, la comprensión mejora la ejecución.'},
      {id:'inm2', nombre:'Partido de contragolpe', desc:'Partido con énfasis en la transición rápida tras recuperar el balón, buscando la finalización en pocos pases.', mat:['balones','porterias','petos'], detalle:'Juega un partido normal destacando y premiando (verbalmente) las transiciones rápidas tras robo, buscando llegar a portería en 3-4 pases como máximo. Trabaja la idea de contragolpe organizado, no solo carrera individual. Consejo: si un equipo recupera y no sale rápido, para el juego y pregúntales qué opción de contragolpe tenían.'},
      {id:'inm3', nombre:'Partido con ABP trabajadas', desc:'Partido incluyendo saques de banda y de esquina ensayados con una jugada simple predefinida.', mat:['balones','porterias','petos'], detalle:'Antes del partido, define con cada equipo una jugada sencilla para el saque de banda cerca de portería contraria (por ejemplo, pared con el jugador más cercano). Durante el partido, cuando se dé esa situación, deben intentar ejecutarla. Introduce el concepto de acción a balón parado trabajada, algo nuevo en esta etapa. Consejo: no compliques la jugada ensayada, cuanto más simple, más fácil de ejecutar bajo la presión del partido real.'},
      {id:'inm4', nombre:'Partido libre con corrección de sistema', desc:'Partido normal parando para corregir la ocupación de espacios según el sistema asignado.', mat:['balones','porterias','petos'], detalle:'Juega con normalidad y para el juego cuando detectes que el sistema se ha desordenado (todos amontonados en una zona, por ejemplo) para reubicar y explicar brevemente. Es el cierre lógico de una sesión centrada en la organización posicional del equipo. Consejo: usa imágenes sencillas (\'sois una cometa\', \'abrid como un abanico\') para que la idea espacial se quede mejor que una explicación técnica.'}
    ]
  };

      {id:'cdt2', foco:'pases', nombre:'Pase a velocidad de ejecución', desc:'Secuencias de pase corto y medio exigiendo velocidad de ejecución y de decisión, no solo precisión.', mat:['balones','conos'], detalle:'Organiza circuitos de pase en movimiento donde la exigencia principal ya no es solo acertar, sino decidir y ejecutar rápido bajo presión de tiempo simulada (por ejemplo, cronometrando la secuencia). Consejo: introduce una variable de decisión (dos posibles receptores) para que el pase no sea automático sino una lectura real de la jugada.'},
      {id:'cdt3', foco:'remate', nombre:'Finalización desde distintas posiciones', desc:'Remates a portería desde varias zonas y ángulos, con oposición o presión de tiempo.', mat:['balones','porterias'], detalle:'Monta estaciones de finalización desde distintas posiciones (frontal, lateral, tras conducción, tras pase) con algo de oposición o límite de tiempo para el disparo. El objetivo es que sepan resolver la finalización en situaciones variadas, no solo en el gesto aislado. Consejo: valora también la decisión de disparo (elegir el mejor momento) además de la ejecución técnica en sí.'},
      {id:'cdt4', foco:'tactica', nombre:'1 contra 1 ofensivo con desequilibrio', desc:'Duelo individual donde el atacante busca desequilibrar con cambios de ritmo y finta antes de definir.', mat:['balones','porterias'], detalle:'Duelo 1 contra 1 desde una posición de ataque, donde el atacante debe emplear un recurso técnico claro (finta, cambio de ritmo, doble contacto) para desequilibrar al defensor antes de definir hacia portería. Trabaja el repertorio individual que a esta edad ya deben empezar a tener asentado. Consejo: deja que cada jugador explore su propio recurso favorito antes de corregir, la personalidad técnica también se entrena.'},
      {id:'cdt5', foco:'tactica', nombre:'1 contra 1 defensivo con recuperación', desc:'Duelo defensivo centrado en recuperar el balón sin cometer falta, forzando la pérdida del rival.', mat:['balones'], detalle:'El mismo duelo pero desde el rol defensivo: el objetivo es recuperar el balón limpio o forzar que el atacante pierda el control, sin cometer infracción. Trabaja la temporización y el timing de entrada, habilidades defensivas de nivel superior a la simple contención de etapas anteriores. Consejo: premia explícitamente las recuperaciones limpias, es fácil que solo se valore el gesto ofensivo y se descuide el defensivo.'},
      {id:'cdt6', foco:'tactica', nombre:'Superioridad e inferioridad numérica', desc:'Situaciones de 4 contra 3 y 3 contra 4 alternadas, trabajando ataque y defensa en desigualdad.', mat:['balones','porterias','conos'], detalle:'Alterna bloques de 4 contra 3 (el equipo en superioridad ataca) y 3 contra 4 (el equipo en inferioridad debe defender bien organizado) con finalización a portería en ambos casos. Es contenido táctico específico de nivel cadete, muy presente en los partidos reales por expulsiones o dobles penaltis. Consejo: explica que en inferioridad no se trata de correr más, sino de ocupar mejor los espacios centrales.'}
    ],

      {id:'cdm2', nombre:'Partido de superioridad e inferioridad', desc:'Partido en el que periódicamente un jugador se retira temporalmente, simulando doble penalti o expulsión.', mat:['balones','porterias','petos'], detalle:'Cada 3-4 minutos, retira temporalmente a un jugador de un equipo (rotando quién sale) simulando una situación de inferioridad real de partido, y observa cómo se reorganiza el equipo. Es una preparación directa para situaciones reales de competición. Consejo: aprovecha las pausas para preguntar al equipo en inferioridad cómo se han organizado, y corrige si hace falta.'},

  var STATE = { history: [] };
