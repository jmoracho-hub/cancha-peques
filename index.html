  var LOCAL_KEY = 'tudela-fs-debutantes-state';

  function $(id){ return document.getElementById(id); }

  function hasClaudeRuntime(){
    return !!(window.claude && window.claude.use);
  }

  function readLocalState(){
    try{
      var raw = localStorage.getItem(LOCAL_KEY);
      if(!raw) return null;
      var parsed = JSON.parse(raw);
      return (parsed && Array.isArray(parsed.history)) ? parsed : null;
    }catch(e){ return null; }
  }

  function writeLocalState(){
    try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(STATE)); return true; }
    catch(e){ return false; }
  }

  function loadState(){
    try{
      var raw = $('state-data').textContent;
      var parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.history)) STATE = parsed;
    }catch(e){ STATE = { history: [] }; }

    // Fuera del runtime de Claude (por ejemplo, alojada en GitHub Pages)
    // el historial se guarda en este navegador, no en la página publicada.
    if(!hasClaudeRuntime()){
      var local = readLocalState();
      if(local) STATE = local;
    }
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp = a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }

  function genId(){
    return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  function splitMinutes(total, n){
    if(n<=0) return [];
    var base = Math.floor(total/n);
    var rem = total - base*n;
    var out = [];
    for(var i=0;i<n;i++){
      var m = base;
      if(rem>0){ m++; rem--; }
      out.push(m);
    }
    return out;
  }

  function pickExcluding(pool, n, excludeIds){
    var avail = pool.filter(function(i){ return excludeIds.indexOf(i.id) === -1; });
    if(avail.length < n) avail = pool.slice();
    return shuffle(avail).slice(0, n);
  }

  function pickTechDiverse(pool, excludeIds){
    var avail = pool.filter(function(i){ return excludeIds.indexOf(i.id) === -1; });
    if(avail.length < 2) avail = pool.slice();
    avail = shuffle(avail);
    for(var i=0;i<avail.length;i++){
      for(var j=i+1;j<avail.length;j++){
        if(avail[i].foco !== avail[j].foco) return [avail[i], avail[j]];
      }
    }
    return avail.slice(0,2);
  }

  function selectedMaterials(){
    return MATERIAL_KEYS.filter(function(k){
      var el = $('mat-' + k);
      return el && el.checked;
    });
  }

  function selectedCategoria(){
    var checked = document.querySelector('input[name="categoria"]:checked');
    return (checked && CATEGORIES[checked.value]) ? checked.value : 'prebenjamin';
  }

  function matOK(materials){
    return function(item){ return item.mat.every(function(m){ return materials.indexOf(m) !== -1; }); };
  }

  function generateSession(dateStr, materials, categoria){
    var catKey = CATEGORIES[categoria] ? categoria : 'prebenjamin';
    var bank = CATEGORIES[catKey].bank;
    var catInfo = CATEGORY_INFO[catKey];
    var sessionInfo = {
      label: CATEGORIES[catKey].label + ' (' + CATEGORIES[catKey].ageRange + ')',
      consejo: catInfo.consejo,
      warmMin: catInfo.warmMin, techMin: catInfo.techMin, matchMin: catInfo.matchMin
    };

    var last2 = STATE.history.slice(0,2).filter(function(s){ return (s.categoria || 'prebenjamin') === catKey; });
    var recentWarmup = [];
    var recentTech = [];
    var recentMatch = [];
    last2.forEach(function(s){
      recentWarmup = recentWarmup.concat(s.warmupIds || []);
      recentTech = recentTech.concat(s.techIds || []);
      if(s.matchId) recentMatch.push(s.matchId);
    });

    var ok = matOK(materials);
    var warmPool = bank.warmup.filter(ok);
    var techPool = bank.tech.filter(ok);
    var matchPool = bank.match.filter(ok);

    var chosenWarm = pickExcluding(warmPool, 2, recentWarmup);
    var chosenTech = pickTechDiverse(techPool, recentTech);
    var chosenMatchArr = pickExcluding(matchPool, 1, recentMatch);
    var chosenMatch = chosenMatchArr[0] || null;

    var warmMinutes = splitMinutes(sessionInfo.warmMin, chosenWarm.length);
    var warmup = chosenWarm.map(function(item, idx){
      var copy = {}; for(var k in item) copy[k]=item[k];
      copy.minutes = warmMinutes[idx];
      return copy;
    });
    var techMinutes = splitMinutes(sessionInfo.techMin, chosenTech.length);
    var tecnica = chosenTech.map(function(item, idx){
      var copy = {}; for(var k in item) copy[k]=item[k];
      copy.minutes = techMinutes[idx];
      return copy;
    });
    var partido = null;
    if(chosenMatch){
      partido = {}; for(var k2 in chosenMatch) partido[k2]=chosenMatch[k2];
      partido.minutes = sessionInfo.matchMin;
    }

    return {
      id: genId(),
      date: dateStr,
      categoria: catKey,
      edadLabel: sessionInfo.label,
      consejo: sessionInfo.consejo,
      warmMin: sessionInfo.warmMin,
      techMin: sessionInfo.techMin,
      matchMin: sessionInfo.matchMin,
      warmupIds: warmup.map(function(i){return i.id;}),
      techIds: tecnica.map(function(i){return i.id;}),
      matchId: partido ? partido.id : null,
      warmup: warmup,
      tecnica: tecnica,
      partido: partido,
      materials: materials.slice()
    };
  }

  function formatDate(dateStr){
    if(!dateStr) return '';
    var d = new Date(dateStr + 'T12:00:00');
    if(isNaN(d.getTime())) return dateStr;
    return new Intl.DateTimeFormat('es-ES', { weekday:'long', day:'numeric', month:'long' }).format(d);
  }

  function updateDayLabel(){
    var v = $('date-input').value;
    $('day-label').textContent = v ? formatDate(v) : '—';
  }

  function materialTags(mat){
    if(!mat.length) return '';
    return '<span class="item-meta">' + mat.map(function(m){
      return '<span class="tag">' + MATERIAL_LABEL[m] + '</span>';
    }).join('') + '</span>';
  }

  var ICON_CHEVRON = '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 9 12 15 17 9"/></svg>';

  function phaseItemsHTML(items, showFoco){
    return '<ul class="phase-items">' + items.map(function(it){
      var focoTag = showFoco ? '<span class="tag tag-foco">' + FOCO_LABEL[it.foco] + '</span>' : '';
      return '<li class="ex-item" data-ex-id="' + it.id + '" tabindex="0" role="button" aria-expanded="false">' +
        '<div class="item-top"><strong>' + it.nombre + '</strong><span class="mono">' + it.minutes + ' min</span></div>' +
        '<p class="item-desc">' + it.desc + '</p>' +
        '<div class="item-meta">' + focoTag + it.mat.map(function(m){ return '<span class="tag">'+MATERIAL_LABEL[m]+'</span>'; }).join('') + '</div>' +
        '<span class="toggle-hint">' + ICON_CHEVRON + '<span class="toggle-hint-text">Ver explicación completa</span></span>' +
        '<div class="item-detail" hidden><p>' + it.detalle + '</p></div>' +
        '</li>';
    }).join('') + '</ul>';
  }

  function sessionCardHTML(session){
    if(!session.warmup.length || !session.tecnica.length || !session.partido){
      return '<div class="warn">No hay suficientes ejercicios disponibles para ese grupo de edad con el material marcado. Prueba a activar algún material más (por ejemplo conos o balones), o a elegir "Mixto (4-6)", y genera de nuevo.</div>';
    }
    var total = session.warmMin + session.techMin + session.matchMin;
    return '<section class="session-card">' +
      '<div class="session-head"><h2>Entreno del <time>' + formatDate(session.date) + '</time></h2>' +
        '<span class="pill pill-blue">' + session.edadLabel + '</span>' +
        '<span class="pill">' + total + ' min</span></div>' +
      '<div class="coach-note"><strong>Consejo del entrenador: </strong>' + session.consejo + '</div>' +
      '<div class="phase phase-warmup">' +
        '<div class="phase-head">' + ICON_WARMUP + '<h3>Calentamiento · juegos</h3><span class="pill pill-gold">' + session.warmMin + ' min</span></div>' +
        phaseItemsHTML(session.warmup, false) +
      '</div>' +
      '<div class="phase phase-tech">' +
        '<div class="phase-head">' + ICON_TECH + '<h3>Ejercicios técnicos</h3><span class="pill pill-pitch">' + session.techMin + ' min</span></div>' +
        phaseItemsHTML(session.tecnica, true) +
      '</div>' +
      '<div class="phase phase-match">' +
        '<div class="phase-head">' + ICON_MATCH + '<h3>Partido</h3><span class="pill pill-red">' + session.matchMin + ' min</span></div>' +
        phaseItemsHTML([session.partido], false) +
      '</div>' +
    '</section>';
  }

  function historySummary(entry){
    var names = entry.warmup.map(function(i){return i.nombre;})
      .concat(entry.tecnica.map(function(i){return i.nombre;}));
    if(entry.partido) names.push(entry.partido.nombre);
    return names.join(' · ');
  }

  function historyHTML(){
    var head = '<div class="history-head"><h2>Historial de sesiones</h2><span class="count-pill">' + STATE.history.length + '</span></div>';
    if(!STATE.history.length){
      return '<section class="history">' + head + '<p class="history-empty">Todavía no hay entrenos guardados. Genera uno y pulsa «Guardar en historial» para que quede registrado y no se repita.</p></section>';
    }
    var items = STATE.history.map(function(entry){
      var edadTag = entry.edadLabel ? '<span class="tag">' + entry.edadLabel + '</span>' : '';
      return '<li class="history-item">' +
        '<div>' +
          '<div class="hi-date">' + formatDate(entry.date) + ' ' + edadTag + '</div>' +
          '<div class="hi-summary">' + historySummary(entry) + '</div>' +
        '</div>' +
        '<button type="button" class="hi-del" data-action="delete" data-id="' + entry.id + '">Eliminar</button>' +
      '</li>';
    }).join('');
    return '<section class="history">' + head + '<ul class="history-list">' + items + '</ul></section>';
  }

  function render(){
    var html = '';
    html += DRAFT ? sessionCardHTML(DRAFT) : '<p class="empty-hint">Pulsa «Generar entreno» para crear la sesión del día.</p>';
    html += historyHTML();
    $('results').innerHTML = html;
  }

  var toastTimer = null;
  function showToast(msg, isWarn){
    var el = $('toast');
    el.textContent = msg;
    el.classList.toggle('warn-toast', !!isWarn);
    el.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
  }

  function handleGenerate(){
    var materials = selectedMaterials();
    var categoria = selectedCategoria();
    var dateStr = $('date-input').value;
    DRAFT = generateSession(dateStr, materials, categoria);
    render();
  }

  function buildFullDocument(){
    var styleTag = document.querySelector('style').outerHTML;
    var headerTag = document.querySelector('.topbar').outerHTML;
    var controlsTag = $('controls').outerHTML;
    var noteTag = document.querySelector('.note').outerHTML;
    var scriptTag = $('app-logic').outerHTML;
    var stateJson = JSON.stringify(STATE).replace(/</g, '\\u003c');
    return '<!doctype html><html lang="es"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">' +
      '<title>Entrenamiento Tudela F.S Debutantes</title>' +
      styleTag +
      '<link rel="preconnect" href="https://fonts.googleapis.com">' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">' +
      '</head><body>' +
      '<div id="app-shell">' +
      headerTag + controlsTag +
      '<main id="results" class="results"></main>' +
      noteTag +
      '</div>' +
      '<div id="toast" role="status" aria-live="polite"></div>' +
      '<script id="state-data" type="application/json">' + stateJson + '<\/script>' +
      scriptTag +
      '</body></html>';
  }

  function handleSave(){
    if(!DRAFT || !DRAFT.warmup.length || !DRAFT.tecnica.length || !DRAFT.partido){
      showToast('Genera un entreno completo antes de guardar.', true);
      return;
    }
    var entry = DRAFT;
    STATE.history.unshift(entry);
    STATE.history = STATE.history.slice(0, 30);

    if(!hasClaudeRuntime()){
      if(writeLocalState()){
        DRAFT = null;
        render();
        showToast('Guardado en este navegador.');
      } else {
        STATE.history.shift();
        showToast('Este navegador no permite guardar el historial (modo privado o almacenamiento bloqueado).', true);
      }
      return;
    }

    Promise.resolve(window.claude.use('artifact')).then(function(artifact){
      if(!artifact){
        // Vista compartida sin permiso de escritura: al menos guarda en este dispositivo.
        if(writeLocalState()){
          DRAFT = null;
          render();
          showToast('Guardado en este dispositivo (esta vista no permite guardarlo para todos).');
        } else {
          STATE.history.shift();
          showToast('Vista de solo lectura: no se puede guardar aquí.', true);
        }
        return;
      }
      var doc = buildFullDocument();
      artifact.publish(doc).then(function(){
        DRAFT = null;
        render();
        showToast('Guardado en el historial.');
      }).catch(function(err){
        STATE.history.shift();
        showToast('No se pudo guardar: ' + (err && (err.code || err.message) || 'error'), true);
      });
    });
  }

  function handleDeleteHistory(id){
    STATE.history = STATE.history.filter(function(e){ return e.id !== id; });
    render();

    if(!hasClaudeRuntime()){
      writeLocalState();
      return;
    }

    Promise.resolve(window.claude.use('artifact')).then(function(artifact){
      if(!artifact){ writeLocalState(); return; }
      artifact.publish(buildFullDocument()).catch(function(){ /* ignore */ });
    });
  }

  function attachHandlers(){
    $('btn-generate').addEventListener('click', handleGenerate);
    $('btn-save').addEventListener('click', handleSave);
    $('btn-print').addEventListener('click', function(){ window.print(); });

    $('date-input').addEventListener('change', function(){
      this.setAttribute('value', this.value);
      updateDayLabel();
    });

    MATERIAL_KEYS.forEach(function(k){
      var el = $('mat-' + k);
      el.addEventListener('change', function(){
        this.toggleAttribute('checked', this.checked);
      });
    });

    CATEGORY_KEYS.forEach(function(k){
      var el = $('cat-' + k);
      el.addEventListener('change', function(){
        CATEGORY_KEYS.forEach(function(k2){ $('cat-' + k2).removeAttribute('checked'); });
        if(this.checked) this.setAttribute('checked', '');
      });
    });

    $('results').addEventListener('click', function(e){
      var delBtn = e.target.closest('[data-action="delete"]');
      if(delBtn){ handleDeleteHistory(delBtn.getAttribute('data-id')); return; }
      var exItem = e.target.closest('.ex-item');
      if(exItem) toggleExercise(exItem);
    });

    $('results').addEventListener('keydown', function(e){
      if(e.key !== 'Enter' && e.key !== ' ') return;
      var exItem = e.target.closest('.ex-item');
      if(!exItem) return;
      e.preventDefault();
      toggleExercise(exItem);
    });
  }

  function toggleExercise(exItem){
    var detail = exItem.querySelector('.item-detail');
    var hint = exItem.querySelector('.toggle-hint-text');
    var expanded = exItem.getAttribute('aria-expanded') === 'true';
    exItem.setAttribute('aria-expanded', expanded ? 'false' : 'true');
    detail.hidden = expanded;
    if(hint) hint.textContent = expanded ? 'Ver explicación completa' : 'Ocultar explicación';
  }

  function boot(){
    loadState();
    attachHandlers();
    var dateInput = $('date-input');
    if(!dateInput.value){
      var t = new Date();
      var iso = t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
      dateInput.value = iso;
      dateInput.setAttribute('value', iso);
    }
    updateDayLabel();
    handleGenerate();
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
